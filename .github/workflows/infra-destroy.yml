name: Infra — Terraform Destroy ⚠️

# DESTRUCTIVE — tears down ALL infrastructure in the selected environment.
# RDS data, ElastiCache, ECS services, VPC — everything Terraform manages.
# Protected by:
#   1. Confirmation text input must match "destroy <env>" exactly
#   2. GitHub Environment reviewer approval (infra-{env})
#   3. Audit trail in GitHub Actions run history and step summary

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy'
        required: true
        type: choice
        options: [dev, stage, prod]
      confirm:
        description: 'Type "destroy <env>" to confirm (e.g. "destroy dev")'
        required: true
        type: string
      reason:
        description: 'Reason for destruction — written to audit summary'
        required: true
        type: string

permissions:
  contents: read

jobs:
  # ── Safety gate ─────────────────────────────────────────────────────────────
  validate:
    name: Validate destruction confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation phrase
        run: |
          EXPECTED="destroy ${{ github.event.inputs.environment }}"
          ACTUAL="${{ github.event.inputs.confirm }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "❌ Confirmation failed."
            echo "   Expected:  \"$EXPECTED\""
            echo "   Received:  \"$ACTUAL\""
            exit 1
          fi
          echo "⚠️  Destruction confirmed for: ${{ github.event.inputs.environment }}"
          echo "   Reason: ${{ github.event.inputs.reason }}"
          echo "   Triggered by: ${{ github.actor }}"

  # ── Terraform Destroy ────────────────────────────────────────────────────────
  destroy:
    name: Destroy — ${{ github.event.inputs.environment }} ⚠️
    runs-on: ubuntu-latest
    needs: [validate]
    # GitHub Environment enforces reviewer approval.
    # infra-dev, infra-stage, infra-prod — all should require at least 1 reviewer for destroy.
    environment: infra-${{ github.event.inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: Terraform Init
        working-directory: infra/terraform/envs/${{ github.event.inputs.environment }}
        # Backend is statically configured in envs/<env>/main.tf — no -backend-config needed.
        run: terraform init -input=false

      - name: Terraform Plan Destroy (preview)
        working-directory: infra/terraform/envs/${{ github.event.inputs.environment }}
        run: |
          echo "Resources that will be destroyed:"
          terraform plan -destroy -no-color -input=false -out=destroy.tfplan 2>&1 \
            | grep -E "^  # |will be destroyed|must be replaced" | head -60 || true
        env:
          TF_VAR_db_master_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}

      - name: Terraform Destroy
        working-directory: infra/terraform/envs/${{ github.event.inputs.environment }}
        run: terraform apply -auto-approve -input=false destroy.tfplan

      - name: Audit Summary
        if: always()
        run: |
          ENV="${{ github.event.inputs.environment }}"
          STATUS="${{ job.status }}"
          echo "## ⚠️ Terraform Destroy — \`$ENV\` — $STATUS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Destroyed by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Reason | ${{ github.event.inputs.reason }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | $STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| Run | [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| Time | $(date -u) |" >> $GITHUB_STEP_SUMMARY
