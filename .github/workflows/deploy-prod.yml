name: Deploy — Prod

# Triggers on release tags (v*).
# The "prod" GitHub Environment requires named approver sign-off.
# Includes a Terraform safety check before deploying — blocks on any
# destructive infrastructure changes (delete/replace).

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
  ENV: prod
  CLUSTER: smart-prod

jobs:
  # ── Terraform safety check ───────────────────────────────────────────────────
  # Blocks the deploy if any infra change would destroy or replace a resource.
  infra-safety-check:
    name: Terraform plan (no destructive changes)
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: Terraform Init
        working-directory: infra/terraform/envs/prod
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=smart-platform/prod/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true" \
            -input=false

      - name: Terraform Plan
        working-directory: infra/terraform/envs/prod
        run: terraform plan -no-color -input=false -out=tfplan
        env:
          TF_VAR_db_master_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}

      - name: Check for destructive changes
        working-directory: infra/terraform/envs/prod
        run: |
          terraform show -json tfplan > plan.json
          python3 - <<'EOF'
          import json, sys
          with open("plan.json") as f:
              plan = json.load(f)
          destructive = [
              c for c in plan.get("resource_changes", [])
              if any(a in c.get("change", {}).get("actions", []) for a in ["delete", "replace"])
          ]
          if destructive:
              print("❌ Destructive changes detected — prod deploy blocked:")
              for c in destructive:
                  print(f"  {c['address']}: {c['change']['actions']}")
              print("\nRun infra-deploy prod manually after review to apply these changes.")
              sys.exit(1)
          print("✅ No destructive infrastructure changes. Proceeding.")
          EOF

  # ── Build & push all Docker images in parallel ───────────────────────────────
  build:
    name: Build — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [infra-safety-check]
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - tenant-service
          - product-service
          - inventory-service
          - order-service
          - logistics-service
          - analytics-service
          - notification-service
          - sync-service

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password | \
            docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Build and push ${{ matrix.service }}
        run: |
          IMAGE="${{ env.ECR_REGISTRY }}/smart-${{ matrix.service }}"
          TAG="${{ github.ref_name }}"  # e.g. v1.2.3
          docker build \
            -t "$IMAGE:$TAG" \
            -t "$IMAGE:${{ env.ENV }}-latest" \
            -f backend/services/${{ matrix.service }}/Dockerfile \
            --cache-from "$IMAGE:${{ env.ENV }}-latest" \
            .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:${{ env.ENV }}-latest"

  # ── Run Alembic migrations ───────────────────────────────────────────────────
  migrate:
    name: Alembic migration — prod
    runs-on: ubuntu-latest
    needs: [build]
    environment: prod

    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Get network config from Secrets Manager
        run: |
          echo "PRIVATE_SUBNETS=$(aws secretsmanager get-secret-value \
            --secret-id smart/${{ env.ENV }}/vpc/private-subnet-ids \
            --query SecretString --output text)" >> $GITHUB_ENV
          echo "ECS_SG=$(aws secretsmanager get-secret-value \
            --secret-id smart/${{ env.ENV }}/ecs/security-group-id \
            --query SecretString --output text)" >> $GITHUB_ENV

      - name: Run migration ECS task
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.CLUSTER }} \
            --task-definition smart-${{ env.ENV }}-migration \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ env.PRIVATE_SUBNETS }}],securityGroups=[${{ env.ECS_SG }}],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"migration","command":["alembic","-c","backend/migrations/alembic.ini","upgrade","head"]}]}' \
            --query 'tasks[0].taskArn' --output text)

          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped \
            --cluster ${{ env.CLUSTER }} \
            --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${{ env.CLUSTER }} \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "❌ Migration failed with exit code $EXIT_CODE"
            exit 1
          fi
          echo "✅ Migration completed successfully"

  # ── Rolling ECS deploy ───────────────────────────────────────────────────────
  deploy:
    name: Deploy ECS services — prod
    runs-on: ubuntu-latest
    needs: [migrate]
    environment: prod

    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Rolling deploy — one service at a time (stability gate)
        run: |
          # Deploy gateway and auth first, then the remaining services.
          CORE_SERVICES="api-gateway auth-service"
          REMAINING="tenant-service product-service inventory-service order-service \
                     logistics-service analytics-service notification-service sync-service"

          for svc in $CORE_SERVICES; do
            aws ecs update-service \
              --cluster ${{ env.CLUSTER }} \
              --service smart-${{ env.ENV }}-$svc \
              --force-new-deployment \
              --no-cli-pager
            aws ecs wait services-stable \
              --cluster ${{ env.CLUSTER }} \
              --services smart-${{ env.ENV }}-$svc
            echo "✅ smart-${{ env.ENV }}-$svc stable"
          done

          for svc in $REMAINING; do
            aws ecs update-service \
              --cluster ${{ env.CLUSTER }} \
              --service smart-${{ env.ENV }}-$svc \
              --force-new-deployment \
              --no-cli-pager
          done
          SERVICE_ARGS=""
          for svc in $REMAINING; do SERVICE_ARGS="$SERVICE_ARGS smart-${{ env.ENV }}-$svc"; done
          aws ecs wait services-stable --cluster ${{ env.CLUSTER }} --services $SERVICE_ARGS
          echo "✅ All services stable in prod"

      - name: Summary
        run: |
          echo "## ✅ Deployed to \`prod\` — Release ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployed by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Time | $(date -u) |" >> $GITHUB_STEP_SUMMARY
