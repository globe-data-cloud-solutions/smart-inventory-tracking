name: Deploy — Prod
on:
  push:
    tags: ["v*"]  # Release tag triggers prod deploy

permissions:
  id-token: write
  contents: read

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: prod  # GitHub environment — requires named approver sign-off
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/smart-github-actions-deploy-prod
          aws-region: us-east-1

      - name: Login to ECR
        run: |
          aws ecr get-login-password | docker login --username AWS \
            --password-stdin ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

      - name: Build and push images
        run: |
          SERVICES="api-gateway auth-service tenant-service product-service inventory-service order-service logistics-service analytics-service notification-service sync-service"
          for svc in $SERVICES; do
            docker build -t smart-$svc -f backend/services/$svc/Dockerfile .
            docker tag smart-$svc:latest \
              ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/smart-$svc:${{ github.ref_name }}
            docker push ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/smart-$svc:${{ github.ref_name }}
          done

      - name: Terraform plan (no destructive changes check)
        working-directory: infra/terraform/envs/prod
        run: |
          terraform init
          terraform plan -out=tfplan
          terraform show -json tfplan | python3 -c "
          import json, sys
          plan = json.load(sys.stdin)
          destructive = [c for c in plan.get('resource_changes',[])
                         if any(a in c.get('change',{}).get('actions',[])
                                for a in ['delete','replace'])]
          if destructive:
              print('Destructive changes detected — manual review required:')
              for c in destructive:
                  print(f'  {c[\"address\"]}')
              sys.exit(1)
          print('No destructive changes. Proceeding.')
          "

      - name: Run Alembic migrations on prod
        run: |
          aws ecs run-task \
            --cluster smart-prod \
            --task-definition smart-prod-migration \
            --overrides '{"containerOverrides":[{"name":"migration","command":["alembic","-c","backend/migrations/alembic.ini","upgrade","head"]}]}' \
            --launch-type FARGATE \
            --wait

      - name: Rolling deploy — ECS services
        run: |
          SERVICES="api-gateway tenant inventory order logistics analytics notification sync"
          for svc in $SERVICES; do
            aws ecs update-service \
              --cluster smart-prod \
              --service smart-prod-$svc \
              --force-new-deployment
            echo "Deployed smart-prod-$svc"
          done
