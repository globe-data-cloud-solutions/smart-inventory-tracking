name: Container Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "locales/**"
      - "scripts/docker/**"
      - "scripts/check_i18n.sh"
      - "scripts/check_locale_parity.py"
      - "scripts/check_help_docs.sh"
      - ".dockerignore"
      - ".github/workflows/container-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "locales/**"
      - "scripts/docker/**"
      - "scripts/check_i18n.sh"
      - "scripts/check_locale_parity.py"
      - "scripts/check_help_docs.sh"
      - ".dockerignore"
      - ".github/workflows/container-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/docker/smoke.sh
