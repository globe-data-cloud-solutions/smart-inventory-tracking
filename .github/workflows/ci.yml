name: CI
on:
  # PR auto-runs disabled — CI no longer runs on pull requests.
  # Still runnable manually from the Actions tab if needed.
  workflow_dispatch:

permissions:
  contents: read
  # id-token: write  # Uncomment after infra-deploy creates the OIDC IAM role

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff==0.9.10 mypy
      - run: ruff check backend/
      - run: ruff format --check backend/ scripts/
      - name: mypy (non-blocking; typing backlog)
        continue-on-error: true
        run: mypy backend/shared/

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: cd frontend && pnpm tsc --noEmit
      - run: cd frontend && pnpm lint

  permission-drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e backend/shared
      - run: python scripts/ci_drift_check.py

  locale-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -c "
          import json, sys
          ok = True
          for l in ['en', 'am', 'or']:
              try:
                  with open(f'locales/{l}.json') as f: data = json.load(f)
                  print(f'{l}: {len(data)} top-level keys — OK')
              except Exception as e:
                  print(f'ERROR loading {l}.json: {e}')
                  ok = False
          sys.exit(0 if ok else 1)
          "

  test-backend:
    # Uses the globe AWS account's dev DB; never runs on other repositories.
    if: github.repository == 'globe-data-cloud-solutions/smart-inventory-tracking'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Using access keys during bootstrap phase.
      # After infra-deploy creates the OIDC role, replace with:
      #   role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/smart-github-actions-ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Fetch dev secrets
        run: |
          echo "DATABASE_URL=$(aws secretsmanager get-secret-value \
            --secret-id smart/dev/db/primary-url --query SecretString --output text)" >> $GITHUB_ENV
          echo "DATABASE_READ_URL=$(aws secretsmanager get-secret-value \
            --secret-id smart/dev/db/read-replica-url --query SecretString --output text)" >> $GITHUB_ENV
          # Owner role: alembic and seed_permissions.py (runtime role has no CREATE).
          echo "MIGRATION_DATABASE_URL=$(aws secretsmanager get-secret-value \
            --secret-id smart/dev/db/migration-url --query SecretString --output text)" >> $GITHUB_ENV
          echo "REDIS_URL=$(aws secretsmanager get-secret-value \
            --secret-id smart/dev/elasticache/redis-url --query SecretString --output text)" >> $GITHUB_ENV
          echo "CELERY_BROKER_URL=$(aws secretsmanager get-secret-value \
            --secret-id smart/dev/elasticache/celery-broker --query SecretString --output text)" >> $GITHUB_ENV
          echo "CELERY_RESULT_BACKEND=$(aws secretsmanager get-secret-value \
            --secret-id smart/dev/elasticache/celery-backend --query SecretString --output text)" >> $GITHUB_ENV
          echo "JWT_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id smart/dev/jwt/secret --query SecretString --output text)" >> $GITHUB_ENV
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install uv
      - run: uv pip install --system -e "backend/shared[test]"
      - run: alembic upgrade head
        working-directory: backend/migrations
      - run: python scripts/seed_permissions.py
      - run: python scripts/create_partitions.py --months 3
      - run: python scripts/check_rls_coverage.py
      - run: pytest backend/ -v --tb=short --cov=backend -m "unit or integration"

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: cd frontend && pnpm test -- --coverage --passWithNoTests

  migration-round-trip:
    # Uses the globe AWS account's dev DB; never runs on other repositories.
    if: github.repository == 'globe-data-cloud-solutions/smart-inventory-tracking'
    runs-on: ubuntu-latest
    needs: [test-backend]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Fetch dev migration DB URL (owner role)
        run: |
          echo "MIGRATION_DATABASE_URL=$(aws secretsmanager get-secret-value \
            --secret-id smart/dev/db/migration-url --query SecretString --output text)" >> $GITHUB_ENV
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install uv
      - run: uv pip install --system -e "backend/shared[test]"
      - working-directory: backend/migrations
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
          echo "Round-trip passed ✅"
