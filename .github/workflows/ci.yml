name: CI
on:
  pull_request:
    branches: [develop, main]

permissions:
  id-token: write
  contents: read

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff mypy
      - run: ruff check backend/
      - run: mypy backend/shared/ --strict

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd frontend && npm ci
      - run: cd frontend && npx tsc --noEmit
      - run: cd frontend && npm run lint

  permission-drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e backend/shared
      - run: python scripts/ci_drift_check.py

  locale-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -c "
          import json, sys
          ok = True
          for l in ['en', 'am', 'or']:
              try:
                  with open(f'locales/{l}.json') as f: data = json.load(f)
                  print(f'{l}: {len(data)} top-level keys — OK')
              except Exception as e:
                  print(f'ERROR loading {l}.json: {e}')
                  ok = False
          sys.exit(0 if ok else 1)
          "

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/smart-github-actions-ci
          aws-region: us-east-1
      - name: Fetch dev secrets
        run: |
          echo "DATABASE_URL=$(aws secretsmanager get-secret-value \
            --secret-id smart/dev/db/primary-url --query SecretString --output text)" >> $GITHUB_ENV
          echo "DATABASE_READ_URL=$(aws secretsmanager get-secret-value \
            --secret-id smart/dev/db/read-replica-url --query SecretString --output text)" >> $GITHUB_ENV
          echo "REDIS_URL=$(aws secretsmanager get-secret-value \
            --secret-id smart/dev/elasticache/redis-url --query SecretString --output text)" >> $GITHUB_ENV
          echo "CELERY_BROKER_URL=$(aws secretsmanager get-secret-value \
            --secret-id smart/dev/elasticache/celery-broker --query SecretString --output text)" >> $GITHUB_ENV
          echo "CELERY_RESULT_BACKEND=$(aws secretsmanager get-secret-value \
            --secret-id smart/dev/elasticache/celery-backend --query SecretString --output text)" >> $GITHUB_ENV
          echo "JWT_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id smart/dev/jwt/secret --query SecretString --output text)" >> $GITHUB_ENV
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install uv
      - run: uv pip install --system -e "backend/shared[test]"
      - run: alembic -c backend/migrations/alembic.ini upgrade head
      - run: python scripts/seed_permissions.py
      - run: python scripts/create_partitions.py --months 3
      - run: pytest backend/ -v --tb=short --cov=backend -m "unit or integration"

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd frontend && npm ci
      - run: cd frontend && npm test -- --coverage --passWithNoTests

  migration-round-trip:
    runs-on: ubuntu-latest
    needs: [test-backend]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/smart-github-actions-ci
          aws-region: us-east-1
      - name: Fetch dev DB URL
        run: |
          echo "DATABASE_URL=$(aws secretsmanager get-secret-value \
            --secret-id smart/dev/db/primary-url --query SecretString --output text)" >> $GITHUB_ENV
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install uv && uv pip install --system alembic asyncpg sqlalchemy
      - run: |
          alembic -c backend/migrations/alembic.ini upgrade head
          alembic -c backend/migrations/alembic.ini downgrade -1
          alembic -c backend/migrations/alembic.ini upgrade head
          echo "Round-trip passed ✅"
