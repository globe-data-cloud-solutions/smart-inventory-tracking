name: Infrastructure
run-name: Infra ${{ inputs.stage }} — ${{ inputs.environment }} (by ${{ github.actor }})

# Single infrastructure pipeline for all Terraform operations.
# Manual trigger only. Two parameters:
#   1. environment — dev | stg | prd  (mapped to envs/dev|stage|prod)
#   2. stage       — validate | plan | apply | delete
#
# Notes:
#   - `validate` runs fully offline (terraform init -backend=false) — no AWS creds,
#     no state access. Safe to run against any environment at any time.
#   - `plan` / `apply` / `delete` use the static S3 backend and need AWS creds.
#   - apply/delete are gated by the GitHub Environment `infra-<env>`; add required
#     reviewers there to require approval for stg/prd. Destructive `delete` runs
#     `terraform destroy` — protect prod via that Environment's reviewer rule.
#   - Assumes the S3 state bucket (gdc-smart-terraform-state) and DynamoDB lock table
#     (smart-terraform-locks) already exist. Create them once out-of-band if needed.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [dev, stg, prd]
      stage:
        description: 'Terraform stage to run'
        required: true
        type: choice
        options: [validate, plan, apply, delete]

permissions:
  contents: read

jobs:
  # ── Resolve the dev/stg/prd input to the envs/<dir> directory name ────────────
  setup:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.map.outputs.env }}
    steps:
      - id: map
        run: |
          case "${{ inputs.environment }}" in
            dev) echo "env=dev"   >> "$GITHUB_OUTPUT" ;;
            stg) echo "env=stage" >> "$GITHUB_OUTPUT" ;;
            prd) echo "env=prod"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "❌ Unknown environment: ${{ inputs.environment }}"; exit 1 ;;
          esac
          echo "Resolved ${{ inputs.environment }} → $(grep env= "$GITHUB_OUTPUT" | cut -d= -f2)"

  # ── Run the requested Terraform stage ─────────────────────────────────────────
  terraform:
    name: terraform ${{ inputs.stage }}
    runs-on: ubuntu-latest
    needs: [setup]
    # GitHub Environment gate — configure reviewers on infra-stage / infra-prod
    # to require approval before apply/delete (and plan) run there.
    environment: infra-${{ needs.setup.outputs.env }}
    defaults:
      run:
        working-directory: infra/terraform/envs/${{ needs.setup.outputs.env }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      # ── validate: offline, no backend, no credentials ──────────────────────────
      - name: Terraform Init (no backend)
        if: inputs.stage == 'validate'
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        if: inputs.stage == 'validate'
        run: terraform validate -no-color

      # ── plan / apply / delete: need AWS credentials + real S3 backend ──────────
      - uses: aws-actions/configure-aws-credentials@v4
        if: inputs.stage != 'validate'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Terraform Init (S3 backend)
        if: inputs.stage != 'validate'
        # Backend is statically configured in envs/<env>/main.tf — no -backend-config.
        run: terraform init -input=false

      - name: Terraform Plan
        if: inputs.stage == 'plan'
        run: terraform plan -no-color -input=false

      - name: Terraform Apply
        if: inputs.stage == 'apply'
        run: terraform apply -auto-approve -input=false

      - name: Delete ECR repositories (pre-destroy cleanup)
        if: inputs.stage == 'delete'
        run: |
          echo "Cleaning up ECR repositories before Terraform destroy..."
          SERVICES="api-gateway auth-service tenant-service product-service inventory-service order-service logistics-service analytics-service notification-service sync-service"
          for service in $SERVICES; do
            repo_name="smart-$service"
            if aws ecr describe-repositories --repository-names "$repo_name" --region ${{ vars.AWS_REGION || 'us-east-1' }} >/dev/null 2>&1; then
              echo "Deleting ECR repository: $repo_name"
              aws ecr delete-repository --repository-name "$repo_name" --force --region ${{ vars.AWS_REGION || 'us-east-1' }} || echo "⚠️  Failed to delete $repo_name (may not exist)"
            else
              echo "ECR repository not found: $repo_name"
            fi
          done
          echo "ECR cleanup complete."

      - name: Terraform Destroy
        if: inputs.stage == 'delete'
        run: terraform destroy -auto-approve -input=false

      # ── Run summary ────────────────────────────────────────────────────────────
      - name: Summary
        if: always()
        working-directory: .
        run: |
          {
            echo "## Infrastructure — \`${{ inputs.stage }}\` on \`${{ needs.setup.outputs.env }}\`"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Stage | ${{ inputs.stage }} |"
            echo "| Environment | ${{ inputs.environment }} → ${{ needs.setup.outputs.env }} |"
            echo "| Triggered by | ${{ github.actor }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
