name: Deploy — Stage
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-stage:
    runs-on: ubuntu-latest
    environment: stage  # GitHub environment — requires reviewer approval
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/smart-github-actions-deploy-stage
          aws-region: us-east-1

      - name: Login to ECR
        run: |
          aws ecr get-login-password | docker login --username AWS \
            --password-stdin ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

      - name: Build and push images
        run: |
          SERVICES="api-gateway auth-service tenant-service product-service inventory-service order-service logistics-service analytics-service notification-service sync-service"
          for svc in $SERVICES; do
            docker build -t smart-$svc -f backend/services/$svc/Dockerfile .
            docker tag smart-$svc:latest \
              ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/smart-$svc:stage-${{ github.sha }}
            docker push ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/smart-$svc:stage-${{ github.sha }}
          done

      - name: Run Alembic migrations on stage
        run: |
          aws ecs run-task \
            --cluster smart-stage \
            --task-definition smart-stage-migration \
            --overrides '{"containerOverrides":[{"name":"migration","command":["alembic","-c","backend/migrations/alembic.ini","upgrade","head"]}]}' \
            --launch-type FARGATE \
            --wait

      - name: Update ECS services
        run: |
          SERVICES="api-gateway tenant inventory order logistics analytics notification sync"
          for svc in $SERVICES; do
            aws ecs update-service \
              --cluster smart-stage \
              --service smart-stage-$svc \
              --force-new-deployment
          done

      - name: Smoke test
        run: |
          sleep 30
          SERVICES="api-gateway tenant inventory"
          for svc in $SERVICES; do
            curl -f https://$svc.stage.smart-platform.com/health || exit 1
          done
