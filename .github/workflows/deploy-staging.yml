name: Deploy — Stage

# Triggers on every push to main.
# The "stage" GitHub Environment requires reviewer approval before deploy proceeds.
# After deploy, runs smoke tests against the stage API.

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
  ENV: stage
  CLUSTER: smart-stage

jobs:
  # ── Build & push all Docker images in parallel ───────────────────────────────
  build:
    name: Build — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - tenant-service
          - product-service
          - inventory-service
          - order-service
          - logistics-service
          - analytics-service
          - notification-service
          - sync-service

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password | \
            docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Build and push ${{ matrix.service }}
        run: |
          IMAGE="${{ env.ECR_REGISTRY }}/smart-${{ matrix.service }}"
          docker build \
            -t "$IMAGE:${{ env.ENV }}-${{ github.sha }}" \
            -t "$IMAGE:${{ env.ENV }}-latest" \
            -f backend/services/${{ matrix.service }}/Dockerfile \
            --cache-from "$IMAGE:${{ env.ENV }}-latest" \
            .
          docker push "$IMAGE:${{ env.ENV }}-${{ github.sha }}"
          docker push "$IMAGE:${{ env.ENV }}-latest"

  # ── Run Alembic migrations ───────────────────────────────────────────────────
  migrate:
    name: Alembic migration — stage
    runs-on: ubuntu-latest
    needs: [build]
    environment: stage  # Requires reviewer approval before this step runs

    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Get network config from Secrets Manager
        run: |
          echo "PRIVATE_SUBNETS=$(aws secretsmanager get-secret-value \
            --secret-id smart/${{ env.ENV }}/vpc/private-subnet-ids \
            --query SecretString --output text)" >> $GITHUB_ENV
          echo "ECS_SG=$(aws secretsmanager get-secret-value \
            --secret-id smart/${{ env.ENV }}/ecs/security-group-id \
            --query SecretString --output text)" >> $GITHUB_ENV

      - name: Run migration ECS task
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.CLUSTER }} \
            --task-definition smart-${{ env.ENV }}-migration \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ env.PRIVATE_SUBNETS }}],securityGroups=[${{ env.ECS_SG }}],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"migration","command":["alembic","-c","backend/migrations/alembic.ini","upgrade","head"]}]}' \
            --query 'tasks[0].taskArn' --output text)

          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped \
            --cluster ${{ env.CLUSTER }} \
            --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${{ env.CLUSTER }} \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "❌ Migration failed with exit code $EXIT_CODE"
            exit 1
          fi
          echo "✅ Migration completed successfully"

  # ── Rolling ECS deploy ───────────────────────────────────────────────────────
  deploy:
    name: Deploy ECS services — stage
    runs-on: ubuntu-latest
    needs: [migrate]
    environment: stage

    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Force new deployment on all services
        run: |
          SERVICES="api-gateway auth-service tenant-service product-service \
                    inventory-service order-service logistics-service \
                    analytics-service notification-service sync-service"
          for svc in $SERVICES; do
            aws ecs update-service \
              --cluster ${{ env.CLUSTER }} \
              --service smart-${{ env.ENV }}-$svc \
              --force-new-deployment \
              --no-cli-pager
          done

      - name: Wait for services to stabilise
        run: |
          SERVICES="api-gateway auth-service tenant-service product-service \
                    inventory-service order-service logistics-service \
                    analytics-service notification-service sync-service"
          SERVICE_ARGS=""
          for svc in $SERVICES; do SERVICE_ARGS="$SERVICE_ARGS smart-${{ env.ENV }}-$svc"; done
          aws ecs wait services-stable --cluster ${{ env.CLUSTER }} --services $SERVICE_ARGS
          echo "✅ All services stable in ${{ env.ENV }}"

  # ── Smoke tests ──────────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke tests — stage
    runs-on: ubuntu-latest
    needs: [deploy]
    environment: stage

    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Get API base URL from Secrets Manager
        run: |
          echo "API_URL=$(aws secretsmanager get-secret-value \
            --secret-id smart/${{ env.ENV }}/api/base-url \
            --query SecretString --output text)" >> $GITHUB_ENV

      - name: Health check — core services
        run: |
          ENDPOINTS="health tenants/health inventory/health"
          for ep in $ENDPOINTS; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.API_URL }}/$ep")
            if [ "$STATUS" != "200" ]; then
              echo "❌ Health check failed: ${{ env.API_URL }}/$ep returned HTTP $STATUS"
              exit 1
            fi
            echo "✅ $ep → $STATUS"
          done

      - name: Summary
        run: |
          echo "## ✅ Deployed to \`stage\`" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\` | Actor: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "Smoke tests passed ✅" >> $GITHUB_STEP_SUMMARY
