name: Infra — Terraform Apply

# Manual trigger only. Selects target environment and applies Terraform.
# stage and prod environments require GitHub Environment reviewer approval
# before the apply step runs.
#
# Run order for a new environment:
#   1. infra-bootstrap    (once — creates S3 + DynamoDB + ECR)
#   2. infra-deploy dev   (creates VPC, RDS, ECS cluster, etc.)
#   3. deploy-dev         (builds images, runs migrations, starts services)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to apply'
        required: true
        type: choice
        options: [dev, stage, prod]
      confirm:
        description: 'Type the environment name to confirm (e.g. "dev")'
        required: true
        type: string

permissions:
  contents: read

jobs:
  # ── Safety gate ─────────────────────────────────────────────────────────────
  validate:
    name: Validate confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "${{ github.event.inputs.environment }}" ]; then
            echo "❌ Confirmation mismatch."
            echo "   Expected: '${{ github.event.inputs.environment }}'"
            echo "   Got:      '${{ github.event.inputs.confirm }}'"
            exit 1
          fi
          echo "✅ Confirmation valid for environment: ${{ github.event.inputs.environment }}"

  # ── Terraform Apply ──────────────────────────────────────────────────────────
  apply:
    name: Apply — ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    needs: [validate]
    # GitHub Environment enforces reviewer approval for stage and prod.
    # Create environments named:  infra-dev  infra-stage  infra-prod
    environment: infra-${{ github.event.inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: Terraform Init
        working-directory: infra/terraform/envs/${{ github.event.inputs.environment }}
        # Backend is statically configured in envs/<env>/main.tf — no -backend-config needed.
        run: terraform init -input=false

      - name: Terraform Plan
        id: plan
        working-directory: infra/terraform/envs/${{ github.event.inputs.environment }}
        run: terraform plan -no-color -input=false -out=tfplan
        env:
          TF_VAR_db_master_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}

      - name: Terraform Apply
        working-directory: infra/terraform/envs/${{ github.event.inputs.environment }}
        run: terraform apply -auto-approve -input=false tfplan

      - name: Capture Terraform Outputs to Secrets Manager
        working-directory: infra/terraform/envs/${{ github.event.inputs.environment }}
        run: |
          ENV="${{ github.event.inputs.environment }}"

          store_secret() {
            local name="$1"
            local value="$2"
            local secret_id="smart/$ENV/$name"
            if aws secretsmanager describe-secret --secret-id "$secret_id" 2>/dev/null; then
              aws secretsmanager put-secret-value --secret-id "$secret_id" --secret-string "$value"
            else
              aws secretsmanager create-secret --name "$secret_id" --secret-string "$value"
            fi
            echo "Stored: $secret_id"
          }

          # Store VPC networking info for deploy workflows to read
          PRIVATE_SUBNETS=$(terraform output -raw private_subnet_ids 2>/dev/null || echo "")
          ECS_SG=$(terraform output -raw ecs_security_group_id 2>/dev/null || echo "")

          [ -n "$PRIVATE_SUBNETS" ] && store_secret "vpc/private-subnet-ids" "$PRIVATE_SUBNETS"
          [ -n "$ECS_SG" ]          && store_secret "ecs/security-group-id" "$ECS_SG"

      - name: Summary
        run: |
          ENV="${{ github.event.inputs.environment }}"
          echo "## ✅ Terraform Apply — \`$ENV\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Applied by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Time | $(date -u) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next step:** Run **Deploy — ${ENV^}** to build images and start ECS services." >> $GITHUB_STEP_SUMMARY
