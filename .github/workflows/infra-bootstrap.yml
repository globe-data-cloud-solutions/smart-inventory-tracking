name: Infra — Bootstrap State Backend

# Run ONCE before any Terraform workflow can execute.
# Creates the S3 bucket and DynamoDB table that Terraform uses as its remote backend.
# Trigger manually from the Actions tab. Safe to re-run — all steps are idempotent.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Create Terraform state backend resources
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Create S3 state bucket
        run: |
          BUCKET="${{ vars.TF_STATE_BUCKET }}"
          REGION="${{ vars.AWS_REGION }}"
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "✅ Bucket $BUCKET already exists — skipping."
          else
            aws s3api create-bucket --bucket "$BUCKET" --region "$REGION" \
              $( [ "$REGION" != "us-east-1" ] && echo "--create-bucket-configuration LocationConstraint=$REGION" )
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$BUCKET" \
              --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration \
              "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
            echo "✅ Created and secured S3 bucket: $BUCKET"
          fi

      - name: Create DynamoDB lock table
        run: |
          TABLE="${{ vars.TF_STATE_LOCK_TABLE }}"
          if aws dynamodb describe-table --table-name "$TABLE" 2>/dev/null; then
            echo "✅ DynamoDB table $TABLE already exists — skipping."
          else
            aws dynamodb create-table \
              --table-name "$TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --tags Key=Project,Value=smart-platform Key=ManagedBy,Value=bootstrap
            aws dynamodb wait table-exists --table-name "$TABLE"
            echo "✅ Created DynamoDB table: $TABLE"
          fi

      - name: Create ECR repositories for all services
        run: |
          SERVICES="api-gateway auth-service tenant-service product-service inventory-service \
                    order-service logistics-service analytics-service notification-service sync-service"
          for svc in $SERVICES; do
            REPO="smart-$svc"
            if aws ecr describe-repositories --repository-names "$REPO" 2>/dev/null; then
              echo "✅ ECR repo $REPO already exists — skipping."
            else
              aws ecr create-repository \
                --repository-name "$REPO" \
                --image-scanning-configuration scanOnPush=true \
                --encryption-configuration encryptionType=AES256 \
                --tags Key=Project,Value=smart-platform
              # Keep only last 10 images per repo
              aws ecr put-lifecycle-policy \
                --repository-name "$REPO" \
                --lifecycle-policy-text '{"rules":[{"rulePriority":1,"description":"Keep last 10","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'
              echo "✅ Created ECR repo: $REPO"
            fi
          done

      - name: Summary
        run: |
          echo "## Bootstrap Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Name |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| S3 state bucket | ${{ vars.TF_STATE_BUCKET }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DynamoDB lock table | ${{ vars.TF_STATE_LOCK_TABLE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ECR repos | smart-{service} x10 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next step:** Run **Infra — Terraform Apply** for the \`dev\` environment." >> $GITHUB_STEP_SUMMARY
