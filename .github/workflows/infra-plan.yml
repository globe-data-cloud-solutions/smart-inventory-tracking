name: Infra — Terraform Plan

# Runs on every PR that touches infra/terraform/**.
# Plans all three environments in parallel and posts results as PR comments.
# Read-only — never applies changes.

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infra-plan.yml'
      - '.github/workflows/infra-deploy.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    name: Plan — ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, stage, prod]

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: Terraform Format Check
        id: fmt
        working-directory: infra/terraform
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        working-directory: infra/terraform/envs/${{ matrix.env }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=smart-platform/${{ matrix.env }}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true" \
            -input=false

      - name: Terraform Validate
        id: validate
        working-directory: infra/terraform/envs/${{ matrix.env }}
        run: terraform validate -no-color

      # GitHub Actions does not support dynamic secret name expressions (secrets[format(...)]).
      # Use if-conditions per environment to map the correct named secret.
      - name: Set env-specific secrets (dev)
        if: matrix.env == 'dev'
        run: |
          echo "TF_VAR_db_master_password=${{ secrets.DB_PASSWORD_DEV }}" >> $GITHUB_ENV
          echo "TF_VAR_jwt_secret=${{ secrets.JWT_SECRET_DEV }}" >> $GITHUB_ENV

      - name: Set env-specific secrets (stage)
        if: matrix.env == 'stage'
        run: |
          echo "TF_VAR_db_master_password=${{ secrets.DB_PASSWORD_STAGE }}" >> $GITHUB_ENV
          echo "TF_VAR_jwt_secret=${{ secrets.JWT_SECRET_STAGE }}" >> $GITHUB_ENV

      - name: Set env-specific secrets (prod)
        if: matrix.env == 'prod'
        run: |
          echo "TF_VAR_db_master_password=${{ secrets.DB_PASSWORD_PROD }}" >> $GITHUB_ENV
          echo "TF_VAR_jwt_secret=${{ secrets.JWT_SECRET_PROD }}" >> $GITHUB_ENV

      - name: Terraform Plan
        id: plan
        working-directory: infra/terraform/envs/${{ matrix.env }}
        run: terraform plan -no-color -input=false -out=tfplan 2>&1 | tee plan_output.txt
        env:
          TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
        continue-on-error: true

      - name: Post Plan Comment to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const planFile = 'infra/terraform/envs/${{ matrix.env }}/plan_output.txt';
            let plan = 'Plan output not available.';
            if (fs.existsSync(planFile)) {
              plan = fs.readFileSync(planFile, 'utf8');
              // Trim to avoid GitHub comment size limit
              if (plan.length > 55000) plan = '...(truncated)\n' + plan.slice(-55000);
            }

            const fmtIcon   = '${{ steps.fmt.outcome }}'   === 'success' ? '✅' : '⚠️';
            const initIcon  = '${{ steps.init.outcome }}'  === 'success' ? '✅' : '❌';
            const validIcon = '${{ steps.validate.outcome }}' === 'success' ? '✅' : '❌';
            const planIcon  = '${{ steps.plan.outcome }}'  === 'success' ? '✅' : '❌';

            const marker = `<!-- tf-plan-${{ matrix.env }} -->`;
            const body = `${marker}
            ### Terraform Plan — \`${{ matrix.env }}\`

            | Step | Result |
            |------|--------|
            | Format | ${fmtIcon} \`${{ steps.fmt.outcome }}\` |
            | Init | ${initIcon} \`${{ steps.init.outcome }}\` |
            | Validate | ${validIcon} \`${{ steps.validate.outcome }}\` |
            | Plan | ${planIcon} \`${{ steps.plan.outcome }}\` |

            <details><summary>📋 Show Plan Output</summary>

            \`\`\`hcl
            ${plan}
            \`\`\`
            </details>

            *Triggered by @${{ github.actor }} · Commit \`${{ github.sha.substring(0, 8) }}\`*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1
