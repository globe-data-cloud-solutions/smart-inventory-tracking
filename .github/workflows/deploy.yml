name: Deploy Application
run-name: Deploy app — ${{ inputs.environment }} (by ${{ github.actor }})

# Single application deployment pipeline for all environments.
# Manual trigger. One parameter: environment (dev | stg | prd), mapped to
# the smart-<env> ECS cluster and smart-<env>-<service> services.
#
# Flow:
#   1. Build + push a Docker image per service (+ migration) to its ECR repo
#      (smart-<service>), tagged <env>-<sha> and <env>-latest. Repo created on
#      first push if missing.
#   2. Run Alembic migrations + permission seed via a one-off ECS task
#      (smart-<env>-migration) — fails the run (not a warning) if the task
#      def is missing, network config can't be read, or the task exits non-zero.
#   3. Force a new ECS deployment for each service (+ outbox-worker/beat) so
#      it pulls the new image, then wait for those services to stabilize.
#
# Requirements / assumptions:
#   - AWS_ACCOUNT_ID and AWS_REGION are set as repo variables; AWS_ACCESS_KEY_ID /
#     AWS_SECRET_ACCESS_KEY as secrets.
#   - smart-<env>-migration task def and the smart-<env>-api-gateway service must
#     exist (defined in the ecs Terraform module) before this workflow can deploy.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to deploy'
        required: true
        type: choice
        options: [dev, stg, prd]
  # Called by lifecycle.yml after infrastructure apply.
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  contents: read

env:
  SERVICES: >-
    api-gateway auth-service tenant-service product-service inventory-service
    order-service logistics-service analytics-service notification-service sync-service
    frontend

jobs:
  # ── Resolve dev/stg/prd → envs directory / cluster suffix ─────────────────────
  setup:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.map.outputs.env }}
    steps:
      - id: map
        run: |
          case "${{ inputs.environment }}" in
            dev) echo "env=dev"   >> "$GITHUB_OUTPUT" ;;
            stg) echo "env=stage" >> "$GITHUB_OUTPUT" ;;
            prd) echo "env=prod"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "❌ Unknown environment: ${{ inputs.environment }}"; exit 1 ;;
          esac

  # ── Build + push one image per service ────────────────────────────────────────
  build-push:
    name: Build & push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [setup]
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - tenant-service
          - product-service
          - inventory-service
          - order-service
          - logistics-service
          - analytics-service
          - notification-service
          - sync-service
          - migration
          - frontend
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Ensure ECR repo exists
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          aws ecr describe-repositories --repository-names "smart-$SERVICE" \
            --region "${{ vars.AWS_REGION }}" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "smart-$SERVICE" \
            --region "${{ vars.AWS_REGION }}" \
            --image-scanning-configuration scanOnPush=true >/dev/null
          echo "ECR repo ready: smart-$SERVICE"

      - name: Build and push image to ECR
        env:
          ENV: ${{ needs.setup.outputs.env }}
          REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
          SERVICE: ${{ matrix.service }}
          DOCKER_BUILDKIT: 0
        run: |
          if [ "$SERVICE" = "migration" ]; then
            DOCKERFILE="backend/migrations/Dockerfile"
          elif [ "$SERVICE" = "frontend" ]; then
            DOCKERFILE="frontend/Dockerfile"
          else
            DOCKERFILE="backend/services/$SERVICE/Dockerfile"
          fi

          aws ecr get-login-password --region "${{ vars.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "$REGISTRY"

          REPO="$REGISTRY/smart-$SERVICE"
          BUILD_ARGS=()
          if [ "$SERVICE" = "frontend" ]; then
            CF_DOMAIN="$(aws cloudfront list-distributions \
              --query "DistributionList.Items[?Comment=='smart-$ENV'].DomainName | [0]" --output text)"
            if [ -z "$CF_DOMAIN" ] || [ "$CF_DOMAIN" = "None" ]; then
              echo "::error::Could not resolve CloudFront domain for smart-$ENV — deploy infra first."
              exit 1
            fi
            BUILD_ARGS=(--build-arg "NEXT_PUBLIC_API_URL=https://$CF_DOMAIN")
          fi

          docker build --no-cache "${BUILD_ARGS[@]}" -t "$REPO:$ENV-${{ github.sha }}" -t "$REPO:$ENV-latest" \
            -f "$DOCKERFILE" .
          docker push "$REPO:$ENV-${{ github.sha }}"
          docker push "$REPO:$ENV-latest"
          echo "Pushed smart-$SERVICE:$ENV-${{ github.sha }}"

  # ── Migrate DB + roll out ECS services ────────────────────────────────────────
  deploy:
    name: Bootstrap, migrate & roll out — ${{ needs.setup.outputs.env }}
    runs-on: ubuntu-latest
    needs: [setup, build-push]
    # GitHub Environment gate — add reviewers on deploy-stage / deploy-prod for approval.
    environment: deploy-${{ needs.setup.outputs.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Bootstrap runtime DB role, migrate, and seed dev sample data (one-off ECS tasks)
        env:
          ENV: ${{ needs.setup.outputs.env }}
        run: |
          NETCFG="$(aws ecs describe-services --cluster "smart-$ENV" --services "smart-$ENV-api-gateway"             --query 'services[0].networkConfiguration.awsvpcConfiguration' --output json)"
          if [ -z "$NETCFG" ] || [ "$NETCFG" = "null" ]; then
            echo "::error::Could not read networkConfiguration from smart-$ENV-api-gateway service."
            exit 1
          fi

          SUBNETS="$(echo "$NETCFG" | python3 -c 'import json,sys; print(",".join(json.load(sys.stdin)["subnets"]))')"
          SGS="$(echo "$NETCFG" | python3 -c 'import json,sys; print(",".join(json.load(sys.stdin)["securityGroups"]))')"

          # Order matters: db-bootstrap creates the runtime role that migrations
          # connect as; seed (dev only) runs after migrations and is skipped where
          # the task is not defined.
          for FAMILY in db-bootstrap migration seed; do
            if ! aws ecs describe-task-definition --task-definition "smart-$ENV-$FAMILY" >/dev/null 2>&1; then
              if [ "$FAMILY" = "seed" ]; then
                echo "No seed task for $ENV — skipping sample-data seed."
                continue
              fi
              echo "::error::Task definition smart-$ENV-$FAMILY not found — define it in Terraform before deploying."
              exit 1
            fi

            TASK_ARN="$(aws ecs run-task               --cluster "smart-$ENV"               --task-definition "smart-$ENV-$FAMILY"               --launch-type FARGATE               --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SGS],assignPublicIp=DISABLED}"               --query 'tasks[0].taskArn' --output text)"
            echo "$FAMILY task started: $TASK_ARN"

            aws ecs wait tasks-stopped --cluster "smart-$ENV" --tasks "$TASK_ARN"

            CONTAINER="$(aws ecs describe-task-definition --task-definition "smart-$ENV-$FAMILY"               --query 'taskDefinition.containerDefinitions[0].name' --output text)"
            EXIT_CODE="$(aws ecs describe-tasks --cluster "smart-$ENV" --tasks "$TASK_ARN"               --query "tasks[0].containers[?name=='$CONTAINER'].exitCode | [0]" --output text)"
            if [ "$EXIT_CODE" != "0" ]; then
              STOPPED_REASON="$(aws ecs describe-tasks --cluster "smart-$ENV" --tasks "$TASK_ARN"                 --query 'tasks[0].stoppedReason' --output text)"
              echo "::error::$FAMILY task failed (exitCode=$EXIT_CODE): $STOPPED_REASON — see log group /ecs/smart-$ENV/migration"
              exit 1
            fi
            echo "$FAMILY task completed successfully."
          done

      - name: Force new deployment for each service
        env:
          ENV: ${{ needs.setup.outputs.env }}
        run: |
          UPDATED=""
          for svc in $SERVICES outbox-worker outbox-beat; do
            if aws ecs describe-services --cluster "smart-$ENV" --services "smart-$ENV-$svc" \
                 --query 'services[0].status' --output text 2>/dev/null | grep -q ACTIVE; then
              aws ecs update-service --cluster "smart-$ENV" --service "smart-$ENV-$svc" --force-new-deployment >/dev/null
              echo "✅ Rolled out smart-$ENV-$svc"
              UPDATED="$UPDATED smart-$ENV-$svc"
            else
              echo "::warning::Service smart-$ENV-$svc not found or inactive — skipped (define it in Terraform)."
            fi
          done

          if [ -n "$UPDATED" ]; then
            # shellcheck disable=SC2086
            aws ecs wait services-stable --cluster "smart-$ENV" --services $UPDATED
            echo "Stable:$UPDATED"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## Deploy — \`${{ needs.setup.outputs.env }}\`"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Environment | ${{ inputs.environment }} → ${{ needs.setup.outputs.env }} |"
            echo "| Image tag | ${{ needs.setup.outputs.env }}-${{ github.sha }} |"
            echo "| Triggered by | ${{ github.actor }} |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
