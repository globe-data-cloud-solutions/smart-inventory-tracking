[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smart-auth-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "smart-shared",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]

[tool.hatch.build.targets.wheel]
# service root is the package — routers/, services/, schemas/ are sub-packages
packages = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
